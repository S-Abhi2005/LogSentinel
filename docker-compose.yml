version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: logsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: logsentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logsentinel-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      PROJECT_NAME: "LogSentinel — Cloud Log Intelligence"
      API_V1_STR: /api/v1
      SECRET_KEY: ${SECRET_KEY:-logsentinel-prod-jwt-secret-key-super-secure-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: logsentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/logsentinel
      BACKEND_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python scripts/create_admin.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logsentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
